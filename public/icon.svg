<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b223d" />
      <stop offset="100%" stop-color="#163e6e" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4" />
  
  <!-- Document Sheet Shape -->
  <g filter="url(#shadow)" transform="translate(106, 80)">
    <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 210 0 L 300 90 L 300 334 C 300 342.84 292.84 350 284 350 L 16 350 C 7.16 350 0 342.84 0 334 Z" fill="#ffffff" />
    <path d="M 210 0 L 210 74 C 210 82.84 217.16 90 226 90 L 300 90 Z" fill="#e2e8f0" />
    
    <!-- Document Lines -->
    <rect x="40" y="55" width="130" height="14" rx="7" fill="#0b223d" />
    <rect x="40" y="85" width="100" height="8" rx="4" fill="#94a3b8" />
    
    <!-- Table Header Placeholder -->
    <rect x="35" y="125" width="230" height="26" rx="4" fill="#dbe7e4" />
    <rect x="45" y="133" width="80" height="10" rx="3" fill="#0b223d" />
    <rect x="195" y="133" width="60" height="10" rx="3" fill="#0b223d" />
    
    <!-- Table Rows -->
    <rect x="35" y="160" width="230" height="16" rx="3" fill="#f8fafc" />
    <rect x="45" y="164" width="100" height="8" rx="2" fill="#64748b" />
    <rect x="205" y="164" width="50" height="8" rx="2" fill="#0b223d" />
    
    <rect x="35" y="184" width="230" height="16" rx="3" fill="#ffffff" />
    <rect x="45" y="188" width="90" height="8" rx="2" fill="#64748b" />
    <rect x="205" y="188" width="50" height="8" rx="2" fill="#0b223d" />
    
    <rect x="35" y="208" width="230" height="16" rx="3" fill="#f8fafc" />
    <rect x="45" y="212" width="110" height="8" rx="2" fill="#64748b" />
    <rect x="205" y="212" width="50" height="8" rx="2" fill="#0b223d" />
    
    <!-- Total Highlight -->
    <rect x="135" y="240" width="130" height="22" rx="4" fill="#dbe7e4" />
    <rect x="145" y="246" width="40" height="10" rx="2" fill="#0b223d" />
    <rect x="200" y="246" width="55" height="10" rx="2" fill="#0f172a" />
  </g>
  
  <!-- MTA Badge in bottom center -->
  <g transform="translate(136, 385)">
    <rect width="240" height="56" rx="28" fill="url(#accent)" filter="url(#shadow)" />
    <text x="120" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">SP MTA</text>
  </g>
</svg>
