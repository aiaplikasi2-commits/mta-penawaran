    <!-- Safe Vite HMR / WebSocket handling for AI Studio iframe sandbox environment -->
    <script>
      (function () {
        // 1. Intercept console.error & console.warn for Vite HMR logs
        const origConsoleError = console.error;
        console.error = function (...args) {
          const str = args
            .map((a) => (a && a.stack ? a.stack : String(a?.message || a)))
            .join(' ');
          if (
            str.includes('WebSocket') ||
            str.includes('createWebSocketModuleRunnerTransport') ||
            str.includes('[vite]') ||
            str.includes('@vite/client')
          ) {
            return;
          }
          origConsoleError.apply(console, args);
        };

        const origConsoleWarn = console.warn;
        console.warn = function (...args) {
          const str = args.map((a) => String(a?.message || a)).join(' ');
          if (
            str.includes('WebSocket') ||
            str.includes('createWebSocketModuleRunnerTransport') ||
            str.includes('[vite]') ||
            str.includes('@vite/client')
          ) {
            return;
          }
          origConsoleWarn.apply(console, args);
        };

        // 2. Window error and unhandledrejection capture
        window.addEventListener(
          'error',
          function (event) {
            const msg = String(event?.message || event?.filename || '');
            if (
              msg.includes('WebSocket') ||
              msg.includes('createWebSocketModuleRunnerTransport') ||
              msg.includes('@vite/client') ||
              msg.includes('[vite]')
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            const reason = String(event?.reason?.message || event?.reason || '');
            if (
              reason.includes('WebSocket') ||
              reason.includes('createWebSocketModuleRunnerTransport') ||
              reason.includes('@vite/client') ||
              reason.includes('[vite]')
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          },
          true
        );

        // 3. Gracefully mock vite-hmr WebSocket so @vite/client never fails or throws in sandbox
        if (typeof window !== 'undefined' && window.WebSocket) {
          const NativeWebSocket = window.WebSocket;
          const MockWebSocket = function (url, protocols) {
            const isVite =
              (typeof protocols === 'string' && protocols.includes('vite')) ||
              (Array.isArray(protocols) &&
                protocols.some((p) => typeof p === 'string' && p.includes('vite'))) ||
              (typeof url === 'string' &&
                (url.includes('vite') ||
                  url.includes('/@vite') ||
                  url.includes('ais-dev') ||
                  url.includes('ais-pre')));

            if (isVite) {
              const listeners = {};
              const dummy = {
                readyState: 1, // OPEN
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                url: String(url),
                protocol: Array.isArray(protocols) ? protocols[0] : String(protocols || ''),
                bufferedAmount: 0,
                extensions: '',
                binaryType: 'blob',
                send: function () {},
                close: function () {},
                addEventListener: function (type, cb) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(cb);
                  if (type === 'open') {
                    setTimeout(() => {
                      try {
                        cb({ type: 'open' });
                      } catch (e) {}
                    }, 5);
                  }
                },
                removeEventListener: function (type, cb) {
                  if (!listeners[type]) return;
                  listeners[type] = listeners[type].filter((fn) => fn !== cb);
                },
                dispatchEvent: function () {
                  return true;
                },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
              };

              setTimeout(() => {
                if (typeof dummy.onopen === 'function') {
                  try {
                    dummy.onopen({ type: 'open' });
                  } catch (e) {}
                }
              }, 5);

              return dummy;
            }

            return new NativeWebSocket(url, protocols);
          };

          MockWebSocket.CONNECTING = 0;
          MockWebSocket.OPEN = 1;
          MockWebSocket.CLOSING = 2;
          MockWebSocket.CLOSED = 3;
          MockWebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket = MockWebSocket;
        }
      })();
    </script>
