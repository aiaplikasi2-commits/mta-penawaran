[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Proxy API routes to Netlify Functions in production
[[redirects]]
  from = "/api/ai-status"
  to = "/.netlify/functions/ai-status"
  status = 200

[[redirects]]
  from = "/api/generate-letter-content"
  to = "/.netlify/functions/generate-letter-content"
  status = 200

[[redirects]]
  from = "/api/revise-letter-content"
  to = "/.netlify/functions/revise-letter-content"
  status = 200

# SPA fallback rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
